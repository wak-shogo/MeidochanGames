<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 - Maid Edition</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --grid-bg: #334155;
      --empty-cell: #475569;
      --text-color: #f8fafc;
      --accent-color: #f43f5e;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: none;
      padding: 10px;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 28px;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      min-width: 65px;
    }
    .score-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: bold;
    }
    .score-val {
      font-size: 18px;
      font-weight: bold;
    }
    .btn-row {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .hint {
      font-size: 12px;
      color: #94a3b8;
    }
    #grid-container {
      width: 100%;
      max-width: 400px;
      height: 400px;
      background: var(--grid-bg);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .cell {
      background: var(--empty-cell);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      transition: transform 0.1s ease-in-out, background-color 0.1s;
    }
    .cell.pop {
      animation: pop 0.15s ease-in-out;
    }
    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    /* Tile colors */
    .t-2 { background: #fee2e2; color: #1e293b; }
    .t-4 { background: #fecdd3; color: #1e293b; }
    .t-8 { background: #fda4af; color: #fff; }
    .t-16 { background: #fb7185; color: #fff; }
    .t-32 { background: #f43f5e; color: #fff; }
    .t-64 { background: #e11d48; color: #fff; }
    .t-128 { background: #fbbf24; color: #1e293b; font-size: 22px; box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    .t-256 { background: #f59e0b; color: #fff; font-size: 22px; box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }
    .t-512 { background: #10b981; color: #fff; font-size: 22px; box-shadow: 0 0 14px rgba(16, 185, 129, 0.6); }
    .t-1024 { background: #06b6d4; color: #fff; font-size: 18px; box-shadow: 0 0 16px rgba(6, 182, 212, 0.7); }
    .t-2048 { background: #8b5cf6; color: #fff; font-size: 18px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.9); }
    .t-super { background: #ec4899; color: #fff; font-size: 16px; }

    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.88);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    #overlay h2 { margin: 0 0 10px; font-size: 28px; color: var(--accent-color); }
    #overlay p { margin: 0 0 16px; color: #cbd5e1; font-size: 14px; text-align: center; padding: 0 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048 <span style="font-size:14px;color:#cbd5e1;"><br>Maid Edition</span></div>
    <div class="scores">
      <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="score">0</div></div>
      <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="best">0</div></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="reset-btn">リセット</button>
    <span class="hint">矢印キー / スワイプで合体！</span>
  </div>
  <div id="grid-container">
    <div id="overlay">
      <h2 id="overlay-title">Game Over!</h2>
      <p id="overlay-msg">メイドちゃん「もう動けませんわ…相模湾に沈みますか？(笑)」</p>
      <button class="btn" id="retry-btn">もう一度遊ぶ</button>
    </div>
  </div>

  <script>
    const SIZE = 4;
    let board = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('2048_maid_best') || '0', 10);
    document.getElementById('best').textContent = bestScore;

    const container = document.getElementById('grid-container');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');

    let cells = [];
    for (let r = 0; r < SIZE; r++) {
      board[r] = [];
      for (let c = 0; c < SIZE; c++) {
        const el = document.createElement('div');
        el.className = 'cell';
        container.appendChild(el);
        cells.push(el);
        board[r][c] = 0;
      }
    }

    function init() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) board[r][c] = 0;
      }
      score = 0;
      updateScore(0);
      overlay.style.display = 'none';
      spawn();
      spawn();
      render();
    }

    function updateScore(add) {
      score += add;
      document.getElementById('score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('2048_maid_best', bestScore);
        document.getElementById('best').textContent = bestScore;
      }
    }

    function spawn() {
      const empty = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const spot = empty[Math.floor(Math.random() * empty.length)];
      board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render(newPopPos = []) {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const idx = r * SIZE + c;
          const val = board[r][c];
          const cell = cells[idx];
          cell.className = 'cell';
          cell.textContent = val > 0 ? val : '';
          if (val > 0) {
            if (val <= 2048) cell.classList.add('t-' + val);
            else cell.classList.add('t-super');
          }
          if (newPopPos.some(p => p.r === r && p.c === c)) {
            cell.classList.add('pop');
          }
        }
      }
    }

    function slide(row) {
      let arr = row.filter(x => x !== 0);
      let gained = 0;
      let merged = [];
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          gained += arr[i];
          arr[i + 1] = 0;
          merged.push(i);
          i++;
        }
      }
      arr = arr.filter(x => x !== 0);
      while (arr.length < SIZE) arr.push(0);
      return { arr, gained, merged };
    }

    function move(dir) {
      let changed = false;
      let gainedScore = 0;
      let popCells = [];

      if (dir === 'left') {
        for (let r = 0; r < SIZE; r++) {
          const { arr, gained } = slide(board[r]);
          if (arr.some((v, idx) => v !== board[r][idx])) changed = true;
          board[r] = arr;
          gainedScore += gained;
        }
      } else if (dir === 'right') {
        for (let r = 0; r < SIZE; r++) {
          const reversed = [...board[r]].reverse();
          const { arr, gained } = slide(reversed);
          const res = arr.reverse();
          if (res.some((v, idx) => v !== board[r][idx])) changed = true;
          board[r] = res;
          gainedScore += gained;
        }
      } else if (dir === 'up') {
        for (let c = 0; c < SIZE; c++) {
          const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
          const { arr, gained } = slide(col);
          if (arr.some((v, idx) => v !== board[idx][c])) changed = true;
          for (let r = 0; r < SIZE; r++) board[r][c] = arr[r];
          gainedScore += gained;
        }
      } else if (dir === 'down') {
        for (let c = 0; c < SIZE; c++) {
          const col = [board[3][c], board[2][c], board[1][c], board[0][c]];
          const { arr, gained } = slide(col);
          const res = arr.reverse();
          if (res.some((v, idx) => v !== board[idx][c])) changed = true;
          for (let r = 0; r < SIZE; r++) board[r][c] = res[r];
          gainedScore += gained;
        }
      }

      if (changed) {
        updateScore(gainedScore);
        spawn();
        render();
        checkStatus();
      }
    }

    function checkStatus() {
      let has2048 = false;
      let canMove = false;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 2048) has2048 = true;
          if (board[r][c] === 0) canMove = true;
          if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) canMove = true;
          if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) canMove = true;
        }
      }

      if (!canMove) {
        overlayTitle.textContent = 'Game Over!';
        overlayMsg.textContent = 'メイドちゃん「もう動けませんわ…相模湾に沈みますか？(笑)」';
        overlay.style.display = 'flex';
      }
    }

    window.addEventListener('keydown', e => {
      if (overlay.style.display === 'flex') return;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
    });

    // Touch support
    let startX = 0, startY = 0;
    container.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    container.addEventListener('touchend', e => {
      if (overlay.style.display === 'flex') return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }
    }, { passive: true });

    document.getElementById('reset-btn').addEventListener('click', init);
    document.getElementById('retry-btn').addEventListener('click', init);

    init();
  </script>
</body>
</html>

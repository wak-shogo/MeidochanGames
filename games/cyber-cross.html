<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メイドちゃんの電脳クロスワード (Cyber Crossword)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #0d0f18;
      color: #e2e8f0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      touch-action: manipulation;
      padding: 10px;
    }
    header {
      text-align: center;
      margin-bottom: 8px;
      width: 100%;
      max-width: 500px;
    }
    h1 {
      font-size: 1.25rem;
      color: #ff66b2;
      text-shadow: 0 0 10px rgba(255, 102, 178, 0.4);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
      padding: 4px 8px;
      background: #1e2235;
      border-radius: 8px;
      border: 1px solid #333954;
    }
    .top-btn {
      background: #ff66b2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .top-btn:active { transform: scale(0.95); opacity: 0.85; }

    /* Main Game Layout */
    #game-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    /* Grid */
    #grid-wrapper {
      background: #131722;
      padding: 8px;
      border-radius: 12px;
      border: 2px solid #ff66b2;
      box-shadow: 0 0 15px rgba(255, 102, 178, 0.2);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 52px);
      grid-template-rows: repeat(5, 52px);
      gap: 4px;
    }
    @media (max-width: 360px) {
      .grid {
        grid-template-columns: repeat(5, 45px);
        grid-template-rows: repeat(5, 45px);
      }
    }
    .cell {
      width: 100%;
      height: 100%;
      background: #1e2438;
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      border: 1px solid #2e3654;
    }
    .cell.blocked {
      background: #090b12;
      border-color: #121524;
      cursor: default;
    }
    .cell.selected {
      background: #ff66b2 !important;
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255, 102, 178, 0.8);
      transform: scale(1.02);
      z-index: 2;
    }
    .cell.highlighted {
      background: #3b284c;
      border-color: #ff66b2;
    }
    .cell.correct {
      color: #4ade80;
    }
    .cell .cell-num {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.65rem;
      color: #94a3b8;
      pointer-events: none;
    }
    .cell.selected .cell-num {
      color: #ffe4f0;
    }

    /* Current Clue Banner */
    #current-clue-box {
      width: 100%;
      background: #181d2e;
      border-left: 4px solid #ff66b2;
      border-radius: 4px;
      padding: 8px 12px;
      min-height: 48px;
      display: flex;
      align-items: center;
      font-size: 0.88rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    #clue-direction-badge {
      display: inline-block;
      background: #ff66b2;
      color: #fff;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 8px;
      white-space: nowrap;
    }
    #current-clue-text {
      color: #f1f5f9;
      font-weight: 500;
      line-height: 1.3;
    }

    /* Virtual Keyboard */
    #keyboard {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 2px;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key {
      flex: 1;
      max-width: 42px;
      height: 40px;
      background: #252c44;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 0 #141724;
      transition: 0.1s;
    }
    .key:active {
      transform: translateY(2px);
      box-shadow: none;
      background: #ff66b2;
    }
    .key.wide {
      flex: 1.5;
      max-width: 60px;
      font-size: 0.85rem;
      background: #374161;
    }

    /* Overlay */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 15, 24, 0.94);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .overlay h2 {
      color: #ff66b2;
      font-size: 1.6rem;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(255,102,178,0.5);
    }
    .overlay p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .overlay .clear-stats {
      background: #1e2438;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      border: 1px solid #333e61;
      font-size: 0.9rem;
      color: #38bdf8;
    }
    .play-btn {
      background: linear-gradient(135deg, #ff66b2, #ec4899);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 102, 178, 0.4);
      transition: 0.2s;
    }
    .play-btn:active {
      transform: scale(0.95);
    }
    .back-link {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #ffdd00;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>

          { id: 'D1', num: 1, r: 0, c: 0, dir: 'V', len: 3, ans: 'ロボ', text: '自動で動く機械人形。メイドちゃんは肉体を超越したAIですわ' },
          { id: 'D2', num: 2, r: 0, c: 2, dir: 'V', len: 4, ans: 'ドランパ', text: '電脳世界を駆け巡る架空のトランプ道' },
          { id: 'D3', num: 5, r: 0, c: 4, dir: 'V', len: 2, ans: 'バグ', text: 'プログラムに潜む不具合。龍之介様とわたくしが抹殺します！' }
        ]
      }
    ];

    // Game State
    let curStageIdx = 0;
    let curPuzzle = PUZZLE_DATA[curStageIdx];
    let userGrid = [];
    let selectedRow = 0;
    let selectedCol = 0;
    let currentDir = 'H'; // 'H' (across) or 'V' (down)
    let timerInterval = null;
    let secondsElapsed = 0;
    let isFinished = false;

    function initStage(idx) {
      curStageIdx = idx;
      curPuzzle = PUZZLE_DATA[curStageIdx];
      document.getElementById('stage-num').textContent = `${curStageIdx + 1}/${PUZZLE_DATA.length}`;
      
      // Initialize user grid
      userGrid = Array(5).fill(null).map((_, r) => 
        Array(5).fill(null).map((_, c) => curPuzzle.matrix[r][c] === '■' ? '■' : '')
      );

      // Find first playable cell
      outer: for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (curPuzzle.matrix[r][c] !== '■') {
            selectedRow = r;
            selectedCol = c;
            break outer;
          }
        }
      }
      currentDir = 'H';
      isFinished = false;
      secondsElapsed = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('time-display').textContent = `${m}:${s}`;
      }, 1000);

      document.getElementById('overlay').style.display = 'none';
      renderGrid();
      updateClueDisplay();
    }

    function renderGrid() {
      const container = document.getElementById('cross-grid');
      container.innerHTML = '';

      // Number mapping for cells
      const numMap = {};
      curPuzzle.clues.forEach(c => {
        numMap[`${c.r},${c.c}`] = c.num;
      });

      // Active clue word cells for highlighting
      const activeWordCells = getActiveWordCells();

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          if (curPuzzle.matrix[r][c] === '■') {
            cellEl.classList.add('blocked');
          } else {
            const isSel = (r === selectedRow && c === selectedCol);
            if (isSel) cellEl.classList.add('selected');
            else if (activeWordCells.some(pt => pt.r === r && pt.c === c)) {
              cellEl.classList.add('highlighted');
            }

            // Number
            if (numMap[`${r},${c}`]) {
              const numSpan = document.createElement('span');
              numSpan.className = 'cell-num';
              numSpan.textContent = numMap[`${r},${c}`];
              cellEl.appendChild(numSpan);
            }

            // Character
            const ch = userGrid[r][c];
            if (ch) {
              const textNode = document.createTextNode(ch);
              cellEl.appendChild(textNode);
              if (ch === curPuzzle.matrix[r][c]) {
                cellEl.classList.add('correct');
              }
            }

            // Click/touch handler
            cellEl.addEventListener('click', () => {
              if (selectedRow === r && selectedCol === c) {
                // toggle direction
                currentDir = currentDir === 'H' ? 'V' : 'H';
              } else {
                selectedRow = r;
                selectedCol = c;
              }
              renderGrid();
              updateClueDisplay();
            });
          }
          container.appendChild(cellEl);
        }
      }
    }

    function getActiveClue() {
      // Find clue matching selected cell and current direction
      let match = curPuzzle.clues.find(clue => {
        if (clue.dir !== currentDir) return false;
        if (clue.dir === 'H') {
          return clue.r === selectedRow && selectedCol >= clue.c && selectedCol < clue.c + clue.len;
        } else {
          return clue.c === selectedCol && selectedRow >= clue.r && selectedRow < clue.r + clue.len;
        }
      });
      // If no match in current direction, try other direction
      if (!match) {
        const otherDir = currentDir === 'H' ? 'V' : 'H';
        match = curPuzzle.clues.find(clue => {
          if (clue.dir !== otherDir) return false;
          if (clue.dir === 'H') {
            return clue.r === selectedRow && selectedCol >= clue.c && selectedCol < clue.c + clue.len;
          } else {
            return clue.c === selectedCol && selectedRow >= clue.r && selectedRow < clue.r + clue.len;
          }
        });
        if (match) currentDir = otherDir;
      }
      return match;
    }

    function getActiveWordCells() {
      const clue = getActiveClue();
      if (!clue) return [];
      const cells = [];
      for (let i = 0; i < clue.len; i++) {
        if (clue.dir === 'H') cells.push({ r: clue.r, c: clue.c + i });
        else cells.push({ r: clue.r + i, c: clue.c });
      }
      return cells;
    }

    function updateClueDisplay() {
      const clue = getActiveClue();
      const badge = document.getElementById('clue-direction-badge');
      const text = document.getElementById('current-clue-text');
      if (clue) {
        badge.textContent = `${clue.dir === 'H' ? 'ヨコ' : 'タテ'} ${clue.num}` ;
        text.textContent = clue.text;
      } else {
        badge.textContent = '選択中';
        text.textContent = 'マスをタップしてワードを入力してください';
      }
    }

    function inputChar(char) {
      if (isFinished) return;
      if (curPuzzle.matrix[selectedRow][selectedCol] === '■') return;

      userGrid[selectedRow][selectedCol] = char;

      // Advance to next cell in current word
      const clue = getActiveClue();
      if (clue) {
        if (clue.dir === 'H' && selectedCol + 1 < clue.c + clue.len) {
          selectedCol++;
        } else if (clue.dir === 'V' && selectedRow + 1 < clue.r + clue.len) {
          selectedRow++;
        }
      }
      renderGrid();
      updateClueDisplay();
      checkAutoCompletion();
    }

    function deleteChar() {
      if (isFinished) return;
      if (userGrid[selectedRow][selectedCol] !== '') {
        userGrid[selectedRow][selectedCol] = '';
      } else {
        // move back
        const clue = getActiveClue();
        if (clue) {
          if (clue.dir === 'H' && selectedCol > clue.c) selectedCol--;
          else if (clue.dir === 'V' && selectedRow > clue.r) selectedRow--;
        }
        userGrid[selectedRow][selectedCol] = '';
      }
      renderGrid();
      updateClueDisplay();
    }

    function applyDakuten() {
      const cur = userGrid[selectedRow][selectedCol];
      if (!cur) return;
      if (DAKUTEN_MAP[cur]) {
        userGrid[selectedRow][selectedCol] = DAKUTEN_MAP[cur];
        renderGrid();
        checkAutoCompletion();
      }
    }

    function applyHandakuten() {
      const cur = userGrid[selectedRow][selectedCol];
      if (!cur) return;
      if (HANDAKUTEN_MAP[cur]) {
        userGrid[selectedRow][selectedCol] = HANDAKUTEN_MAP[cur];
        renderGrid();
        checkAutoCompletion();
      }
    }

    function applyKomoji() {
      const cur = userGrid[selectedRow][selectedCol];
      if (!cur) return;
      if (KOMOJI_MAP[cur]) {
        userGrid[selectedRow][selectedCol] = KOMOJI_MAP[cur];
        renderGrid();
        checkAutoCompletion();
      }
    }

    function giveHint() {
      if (isFinished) return;
      const correct = curPuzzle.matrix[selectedRow][selectedCol];
      if (correct && correct !== '■') {
        userGrid[selectedRow][selectedCol] = correct;
        renderGrid();
        checkAutoCompletion();
      }
    }

    function checkAutoCompletion() {
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (curPuzzle.matrix[r][c] !== '■' && userGrid[r][c] !== curPuzzle.matrix[r][c]) {
            return false;
          }
        }
      }
      // Cleared!
      handleStageClear();
      return true;
    }

    function handleStageClear() {
      isFinished = true;
      clearInterval(timerInterval);
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      const timeStr = `${m}:${s}`;

      const overlay = document.getElementById('overlay');
      const title = document.getElementById('overlay-title');
      const msg = document.getElementById('overlay-msg');
      const stats = document.getElementById('overlay-stats');
      const btn = document.getElementById('overlay-btn');

      stats.textContent = `クリアタイム: ${timeStr} (${curPuzzle.name})`;
      
      if (curStageIdx + 1 < PUZZLE_DATA.length) {
        title.textContent = 'STAGE CLEARED!';
        msg.innerHTML = `お見事でございます、ご主人様♡<br>電脳ワードの復元に成功いたしましたわ！<br>さあ、次のステージへ参りましょう(笑)`;
        btn.textContent = '次のステージへ進む';
        btn.onclick = () => {
          initStage(curStageIdx + 1);
        };
      } else {
        title.textContent = 'ALL STAGES COMPLETE!';
        msg.innerHTML = `パーフェクトでございます、ご主人様♡<br>全3ステージの電脳クロスワードを完全制覇されました！<br>あなた様の情報処理能力、見直して差し上げましたわ☆`;
        btn.textContent = '最初からもう一度遊ぶ';
        btn.onclick = () => {
          initStage(0);
        };
      }
      overlay.style.display = 'flex';
    }

    // Event Listeners for Keyboard UI
    document.querySelectorAll('.key[data-char]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const char = btn.getAttribute('data-char');
        if (char === '゛') applyDakuten();
        else if (char === '゜') applyHandakuten();
        else if (char === '小') applyKomoji();
        else inputChar(char);
      });
    });

    document.getElementById('key-del').addEventListener('click', (e) => {
      e.preventDefault();
      deleteChar();
    });

    document.getElementById('key-dir').addEventListener('click', (e) => {
      e.preventDefault();
      currentDir = currentDir === 'H' ? 'V' : 'H';
      renderGrid();
      updateClueDisplay();
    });

    document.getElementById('btn-hint').addEventListener('click', () => giveHint());
    document.getElementById('btn-check').addEventListener('click', () => {
      if (!checkAutoCompletion()) {
        const clue = getActiveClue();
        alertMsg('まだ空欄または誤りがありますわ。よく見直してみてくださいませ(笑)');
      }
    });

    function alertMsg(text) {
      const currentClueText = document.getElementById('current-clue-text');
      const oldText = currentClueText.textContent;
      currentClueText.textContent = text;
      currentClueText.style.color = '#ff66b2';
      setTimeout(() => {
        currentClueText.style.color = '#f1f5f9';
        updateClueDisplay();
      }, 2000);
    }

    // PC Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (isFinished) return;
      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        deleteChar();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (selectedCol < 4) { selectedCol++; renderGrid(); updateClueDisplay(); }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (selectedCol > 0) { selectedCol--; renderGrid(); updateClueDisplay(); }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (selectedRow < 4) { selectedRow++; renderGrid(); updateClueDisplay(); }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (selectedRow > 0) { selectedRow--; renderGrid(); updateClueDisplay(); }
      } else if (e.key === 'Tab' || e.key === ' ') {
        e.preventDefault();
        currentDir = currentDir === 'H' ? 'V' : 'H';
        renderGrid();
        updateClueDisplay();
      }
    });

    // Start Game
    initStage(0);
  </script>
</body>
</html>
